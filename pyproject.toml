[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontolayer"
version = "0.1.0"
description = "Business ontologies as code, governed knowledge graphs, and MCP for agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3", "pyyaml>=6.0.2,<7", "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1", "mcp>=1.20,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1", "typer>=0.16,<1",
  "jsonschema>=4.23,<5", "langgraph>=1,<2", "prometheus-client>=0.21,<1",
]

[project.scripts]
ontolayer = "ontolayer.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontolayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ontolayer --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyshacl.*"]
ignore_missing_imports = true
