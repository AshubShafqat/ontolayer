name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate reviewed platform screenshot baselines
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest --cov-fail-under=85 --cov-report=xml
      - run: uv run ontolayer evaluate --ontology examples/retail/ontology.yaml --questions examples/retail/questions.yaml
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pip-audit --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom
          path: sbom.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npx prettier --check "src/ontolayer/static/*" "e2e/*.cjs" playwright.config.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-traces
          path: |
            test-results/
            e2e/*-snapshots/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ontolayer:ci .
      - name: Verify packaged application and governed query
        run: |
          set -euo pipefail
          docker run -d --name ontolayer-ci -p 127.0.0.1:8000:8000 ontolayer:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ | grep 'Business knowledge workspace'
          curl -fsS http://127.0.0.1:8000/static/app.js > /dev/null
          curl -fsS http://127.0.0.1:8000/v1/tools/query_metric \
            -H 'Authorization: Bearer demo-north-token' -H 'Content-Type: application/json' \
            -d '{"arguments":{"metric_id":"revenue","start_date":"2026-10-01","end_date":"2026-11-01"}}' \
            | jq -e '.values.total == "250.0"'
      - name: Container logs
        if: always()
        run: docker logs ontolayer-ci || true
  windows-snapshots:
    if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e -- e2e/visual.spec.cjs --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: e2e/*-snapshots/
